# 宝塔面板部署配置（Nginx）
# 用法：宝塔面板 → 网站 → 添加站点 → 配置文件，替换为以下内容
# 注意：把下面三处占位符换成你的实际值
#   1. server_name 处换成你的域名（无域名可留 _ 用 IP 访问）
#   2. 如果你的服务器路径不是 /var/www/xiwnn，请同步修改所有 root 与 proxy_pass 相关路径
#   3. 管理后台 Python 进程需监听 127.0.0.1:8124（见部署指南第 5 步）

server {
    listen 80;
    server_name _;   # 换成你的域名，例如 blog.example.com；无域名用 IP 访问时保持 _

    # 站点根目录（管理后台反代与域名目录映射见下方 location）
    root /var/www/xiwnn;

    # ---- 离线站点 ----
    # 根路径 → 首页
    location = / {
        root /var/www/xiwnn/www.shawn.com;
        index index.html;
    }

    # 三个域名目录直接映射到镜像根（CDN 资源、旧版采样库）
    location /www.shawn.com/ {
        root /var/www/xiwnn;
        index index.html;
        try_files $uri $uri/ =404;
    }
    location /o.shawn.com/ {
        root /var/www/xiwnn;
    }
    location /cdn.jsdelivr.net/ {
        root /var/www/xiwnn;
    }

    # 根绝对路径映射（Vue 客户端会把导航重写为 /article/xxx、/piano/ 等，
    # 全部指到主站目录 www.shawn.com 下，目录自动补 index.html）
    location / {
        root /var/www/xiwnn/www.shawn.com;
        index index.html;
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # ---- 管理后台（反向代理到本地 Python 服务）----
    location /admin/ {
        proxy_pass http://127.0.0.1:8124;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8124;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源缓存（图片、字体、音频）
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot|mp3|ogg|wav)$ {
        root /var/www/xiwnn;
        expires 7d;
        add_header Cache-Control "public";
    }

    access_log /www/wwwlogs/xiwnn.log;
    error_log /www/wwwlogs/xiwnn.error.log;
}
